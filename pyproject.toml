[project]
name = "breakout"
version = "0.1.0"
description = "Creator growth intelligence lakehouse: ingest, model, and explain YouTube performance."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Lucas" }]
dependencies = [
    "dagster>=1.10",
    "dagster-webserver>=1.10",
    "dbt-duckdb>=1.9",
    "duckdb>=1.5.2",
    "httpx>=0.28",
    "pandas>=2.2",
    "plotly>=5.24",
    "pyarrow>=18",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1",
    "streamlit>=1.40",
    "structlog>=24",
    "tenacity>=9",
]

[project.optional-dependencies]
snowflake = ["snowflake-snowpark-python>=1.24"]

[project.scripts]
breakout = "breakout.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4",
    "pytest>=8",
    "psutil>=6",
    "pytest-cov>=6",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["breakout*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["dbt_project/", "src/pipeline/"]
