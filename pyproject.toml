[project]
name = "production-data-pipeline"
version = "0.1.0"
description = "Sample extract-transform-load pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["snowflake-snowpark-python>=1.24"]

[project.scripts]
run-pipeline = "pipeline.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]
