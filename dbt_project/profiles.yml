breakout:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('BREAKOUT_DUCKDB', 'data/breakout.duckdb') }}"
      extensions:
        - ducklake
      attach:
        - path: "ducklake:sqlite:{{ env_var('BREAKOUT_DUCKLAKE_CATALOG', 'data/breakout_catalog.sqlite') }}"
          alias: lake
          is_ducklake: true
          options:
            DATA_PATH: "{{ env_var('BREAKOUT_DUCKLAKE_DATA', 'data/lake') }}"
      database: lake
      schema: silver
      threads: 4

    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'SILVER') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      threads: 4
      query_tag: breakout_dbt
