name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -q

      - name: Smoke the local lakehouse
        run: uv run breakout status

      - name: Validate Dagster definitions
        run: uv run dagster definitions validate -m breakout.definitions

  dbt:
    name: dbt build (fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Seed deterministic fixture
        run: uv run python tests/fixtures/seed_dbt_fixture.py

      - name: Build and test marts
        env:
          BREAKOUT_DUCKDB: .tmp/dbt/breakout.duckdb
          BREAKOUT_DUCKLAKE_CATALOG: .tmp/dbt/catalog.sqlite
          BREAKOUT_DUCKLAKE_DATA: .tmp/dbt/lake
        run: uv run dbt build --project-dir dbt_project --profiles-dir dbt_project

      - name: Evaluate SLOs
        env:
          DATA_DIR: .tmp/dbt
          RAW_DIR: .tmp/dbt/raw
          DUCKDB_PATH: .tmp/dbt/breakout.duckdb
          DUCKLAKE_CATALOG: .tmp/dbt/catalog.sqlite
          DUCKLAKE_DATA: .tmp/dbt/lake
          QUOTA_DB: .tmp/dbt/quota.sqlite
        run: uv run breakout health
